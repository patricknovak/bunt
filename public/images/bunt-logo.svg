<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80" width="480" height="80">
  <defs>
    <style>
      .logo-text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1a1a2e; }
      .logo-bunt { font-weight: 700; font-size: 48px; letter-spacing: 4px; }
      .logo-amp { font-weight: 300; font-size: 36px; }
      .logo-assoc { font-weight: 400; font-size: 18px; letter-spacing: 3px; }
      .logo-line { stroke: #0f4c75; stroke-width: 2; }
      .logo-accent { fill: #0f4c75; }
    </style>
  </defs>
  <text x="0" y="50" class="logo-text logo-bunt">BUNT</text>
  <text x="172" y="46" class="logo-text logo-amp logo-accent">&amp;</text>
  <line x1="195" y1="15" x2="195" y2="60" class="logo-line" />
  <text x="208" y="35" class="logo-text logo-assoc">ASSOCIATES</text>
  <text x="208" y="58" class="logo-text" style="font-size: 11px; letter-spacing: 2.5px; fill: #6c757d;">ENGINEERING LTD.</text>
</svg>
